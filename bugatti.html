<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer | Bugatti Chiron</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @font-face { font-family: 'BebasNeue'; src: url('./BebasNeue-Regular.ttf') format('truetype'); font-display: swap; }
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body { width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #ffffff; font-family: 'Roboto', sans-serif; }
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; background: #000; z-index: 100; flex-shrink: 0; }
        .nav-bar a { padding: 10px 25px; background: #050505; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; text-transform: uppercase; border: 2px solid #333; transition: 0.3s; }
        .nav-bar a.active { border-color: #fff; }
        .container { position: relative; flex: 1; background: #f0f0f0; display: flex; flex-direction: column; }
        .background-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(5rem, 15vw, 20rem); font-weight: bold; color: #038dfd; font-family: 'BebasNeue', sans-serif; z-index: 0; pointer-events: none; white-space: nowrap; user-select: none; }
        model-viewer { width: 100%; height: 100%; z-index: 10; }
        #lazy-load-poster { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #666; }
        .bugatti-paragraph { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(30px); width: 90%; max-width: 700px; background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 20; opacity: 0; transition: 1s ease-out; line-height: 1.6; font-family: 'Inter', sans-serif; }
        .bugatti-paragraph.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="index.html">BMW M5</a>
        <a href="mercedes.html">Mercedes CLS</a>
        <a href="bugatti.html" class="active">Bugatti Chiron</a>
    </nav>
    <main class="container">
        <div class="background-text" id="backgroundText">BUGGATI CHIRON</div>
        <model-viewer id="modelViewer" src="2016_bugatti_chiron.glb" alt="Bugatti Chiron" auto-rotate camera-controls shadow-intensity="1" environment-image="neutral" exposure="1" ar>
            <div slot="poster" id="lazy-load-poster">LOADING BUGATTI...</div>
        </model-viewer>
        <div class="bugatti-paragraph" id="bugatti-text"><b>The Bugatti Chiron</b> is the pinnacle of performance, featuring an 8.0-liter quad-turbocharged W16 engine.</div>
    </main>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script>
        (function(){
            const mv = document.getElementById('modelViewer');
            const bg = document.getElementById('backgroundText');
            if (mv && bg) {
                mv.addEventListener('camera-change', () => {
                    try {
                        const orbit = mv.getCameraOrbit();
                        let thetaRad = 0;
                        if (orbit == null) {
                            thetaRad = 0;
                        } else if (typeof orbit === 'string') {
                            const first = orbit.trim().split(/\s+/)[0];
                            if (first.endsWith('rad')) {
                                thetaRad = parseFloat(first.replace('rad','')) || 0;
                            } else if (first.endsWith('deg')) {
                                thetaRad = (parseFloat(first.replace('deg','')) || 0) * Math.PI/180;
                            } else {
                                thetaRad = parseFloat(first) || 0;
                            }
                        } else if (Array.isArray(orbit)) {
                            thetaRad = orbit[0] || 0;
                        } else if (orbit.theta !== undefined) {
                            thetaRad = orbit.theta;
                        }
                        const thetaDeg = thetaRad * 180 / Math.PI;
                        bg.style.left = `calc(50% + ${thetaDeg * 0.3}px)`;
                    } catch (e) {
                        console.warn('camera-change handler error', e);
                    }
                });
            }
            window.addEventListener('load', () => {
                setTimeout(() => {
                    const el = document.getElementById('bugatti-text');
                    if (el) el.classList.add('visible');
                }, 500);
            });
        })();
    </script>
</body>
</html>
